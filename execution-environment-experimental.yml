# yamllint disable rule:line-length rule:key-duplicates rule:document-start
# (ansible-builder syntax and long RUN lines required)
version: 3

images:
  base_image:
    name: quay.io/ansible/awx-ee:latest
    # name: quay.io/centos/centos:stream9
dependencies:
  ansible_core:
    package_pip: ansible-core<=2.17
  ansible_runner:
    package_pip: ansible-runner
  python_interpreter:
    package_system: "python3.12"
    python_path: "/usr/bin/python3.12"
  galaxy:
    roles:
        - src: mk-ansible-roles.check_reboot
        - src: mk-ansible-roles.setup_nfs_server
    collections:
        - name: azure.azcollection
        - name: google.cloud
        - name: vmware.vmware_rest
        - name: community.vmware
          version: 3.9.0
        - name: openstack.cloud
          version: 1.8.0
        - name: ibm.power_hmc
        - name: fedora.linux_system_roles
        - name: community.general
        - name: ansible.posix
        - name: git+https://github.com/sap-linuxlab/community.sap_install.git,dev
          type: git
        - name: git+https://github.com/sap-linuxlab/community.sap_libs.git,dev
          type: git
        - name: git+https://github.com/sap-linuxlab/community.sap_operations.git,dev
          type: git
        - name: git+https://github.com/sap-linuxlab/community.sap_launchpad.git,dev
          type: git
  python: requirements.txt
  system:
    - gcc
    - gcc-c++
    - python3.12-devel
    - openssl
    - openssl-devel
    - cargo

options:
  package_manager_path: /usr/bin/dnf

additional_build_steps:
  prepend_builder:
    # On ppc64le, disable compiler optimization to prevent OOM kills when
    # cross-compiling large Cython extensions (e.g. pandas) via qemu.
    # A wrapper shell conditionally sets CFLAGS only on ppc64le so that
    # x86_64 and aarch64 builds keep full -O3 optimization.
    - RUN printf '#!/bin/bash\nif [ "$(uname -m)" = "ppc64le" ]; then\n  export CFLAGS="-O0 -g0"\n  export CXXFLAGS="-O0 -g0"\nfi\nexec /bin/bash "$@"\n' > /usr/local/bin/build-shell && chmod +x /usr/local/bin/build-shell
    - 'SHELL ["/usr/local/bin/build-shell", "-c"]' # yamllint disable-line rule:quoted-strings
  prepend_base:
    - RUN dnf update -y
  append_final:
    - RUN dnf clean all
